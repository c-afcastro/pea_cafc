<style>
:root{
  /* Linguagem visual do wirteilen: coluna única estilo iOS, cartões brancos agrupados
     sobre cinza neutro, cartão-resumo escuro, barra de abas translúcida. */
  --bg:#F2F2F0; --paper:#FFFFFF; --line:#E3E3E0; --sep:rgba(60,60,67,.14);
  --ink:#1D1D1F; --muted:#6E6E73; --ink-3:#8A8A8E; --ink-4:#AEAEB2;
  --accent:#1A3A5C; --accent-ink:#FFFFFF; --accent-soft:rgba(26,58,92,.10); --accent-line:rgba(26,58,92,.18);
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.08);
  --live:#2F7D4F; --neg:#9A3A4C;
  --m1:#C7773F; --m2:#2F6FC2; --m3:#2F8F5B; --m4:#6E2B3A; --m5:#4A5A70;
  --hero:#1D1D1F; --hero-ink:#FFFFFF; --hero-2:rgba(255,255,255,.64); --hero-live:#8FD9A8;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.035);
  --scrim:rgba(0,0,0,.30); --seg-on:var(--paper);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --paper:#1C1C1E; --line:#38383A; --sep:rgba(84,84,88,.55);
    --ink:#F5F5F7; --muted:#98989D; --ink-3:#8D8D93; --ink-4:#636366;
    --accent:#86AEDD; --accent-ink:#0B1A2B; --accent-soft:rgba(134,174,221,.16); --accent-line:rgba(134,174,221,.32);
    --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
    --live:#6CCB92; --neg:#F08C9B;
    --m1:#EBA66F; --m2:#7FB2F2; --m3:#7FD3A2; --m4:#E59AAA; --m5:#A9B6C8;
    --hero:#1C1C1E; --shadow:none; --scrim:rgba(0,0,0,.55); --seg-on:#636366; color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;letter-spacing:-.005em;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Ícones (desenho SF Symbols) */
.ic{display:inline-block;flex:none;width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.ic .f,.ic.f{fill:currentColor;stroke:none}

/* Estrutura */
.frame{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:16px 12px}
.top-l{display:grid;gap:2px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--muted)}
.eyebrow img{width:18px;height:18px;border-radius:5px}
.gname{margin:0;font-family:var(--display);font-size:clamp(26px,7.4vw,32px);font-weight:700;letter-spacing:-.025em;line-height:1.1}
.cbtn{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;max-width:52vw;padding:0 10px 0 12px;border-radius:999px;
  background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--line);font-size:14px;font-weight:600}
.cbtn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn .ic{width:14px;height:14px;stroke-width:2.4;color:var(--ink-3)}
.flag{font-size:18px;line-height:1}

/* Cartão escuro: tocando agora */
.hero{display:grid;gap:14px;width:100%;margin-top:2px;padding:16px;border-radius:20px;background:var(--hero);color:var(--hero-ink);text-align:left}
@media (prefers-color-scheme: dark){.hero{border:1px solid var(--line)}}
.hero-top{display:grid;grid-template-columns:64px minmax(0,1fr) 52px;gap:14px;align-items:center}
.hero .art{width:64px;height:64px;border-radius:14px}
.hero-k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--hero-2)}
.hero-k.live{color:var(--hero-live)}
.hero-t{display:block;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-s{display:block;font-size:13.5px;color:var(--hero-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-play{width:52px;height:52px;border-radius:50%;background:#fff;color:#1D1D1F;display:grid;place-items:center}
.hero-play .ic{width:24px;height:24px}
.hero-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.hero-kpis span{display:block;font-size:11.5px;color:var(--hero-2)}
.hero-kpis b{display:block;font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Capa / miniatura */
.art{position:relative;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:11px;
  background:color-mix(in srgb,var(--c,var(--m5)) 14%,var(--paper));color:var(--c,var(--m5));font-weight:700;letter-spacing:-.02em}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.art img.cover{object-fit:cover}
.hero .art{background:rgba(255,255,255,.1);color:#fff}

/* Equalizador animado (ao vivo) */
.eq{display:inline-flex;align-items:flex-end;gap:2px;width:14px;height:11px}
.eq i{flex:1;background:currentColor;border-radius:1px;height:40%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.eq.off i{animation:none;height:35%}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}

/* Pílulas de gênero */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px -16px 0;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}

/* Listas agrupadas */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 2px 8px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.sec .num{font-size:13px;font-weight:500;color:var(--muted)}
.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow)}
.list{padding:0 4px 0 14px;margin:0;list-style:none}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:12px;align-items:center;border-bottom:.5px solid var(--sep)}
.row:last-child{border-bottom:0}
.row .hit{display:contents;text-align:left}
.row .art{width:44px;height:44px;font-size:15px;margin-block:10px}
.row-main{min-width:0;padding-block:10px}
.row-t{display:flex;align-items:center;gap:7px;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-t span{overflow:hidden;text-overflow:ellipsis}
.row-s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .row-t{color:var(--accent);font-weight:600}
.row.on .eq{color:var(--accent)}
.star{width:44px;height:44px;display:grid;place-items:center;color:var(--ink-4)}
.star .ic{width:22px;height:22px;stroke-width:1.6}
.star.fav{color:#D69E2E}
.star.fav .ic{fill:currentColor}
.empty{display:grid;justify-items:center;gap:8px;padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty b{color:var(--ink);font-size:16px;font-weight:600}
.empty p{margin:0;max-width:32ch;font-size:14px}
.empty .ic{width:40px;height:40px;stroke-width:1.3;color:var(--ink-4)}
.skel{height:64px;border-bottom:.5px solid var(--sep);display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.skel:last-child{border-bottom:0}
.skel i{display:block;height:44px;border-radius:11px;background:var(--fill-2)}
.skel em{display:block;height:12px;width:60%;border-radius:6px;background:var(--fill-2)}
.skel em+em{width:36%;margin-top:7px}

/* Busca */
.search{position:relative}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3);stroke-width:2}
.search input{width:100%;height:40px;border:0;border-radius:11px;background:var(--fill);padding:0 36px 0 36px;font-size:16px;-webkit-appearance:none;appearance:none;outline:none}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:grid;place-items:center;color:var(--ink-3)}
.search .x .ic{position:static;transform:none;width:18px;height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;margin-top:10px;border-radius:10px;background:var(--fill)}
.seg button{min-height:32px;border-radius:8px;font-size:13.5px;font-weight:500;transition:background .2s var(--ease)}
.seg button[aria-selected="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--muted)}

/* Mini player (acima da barra de abas) */
.mini{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));z-index:7;padding:0 10px 8px;pointer-events:none;
  transition:transform .3s var(--ease),opacity .3s var(--ease)}
.mini.away{transform:translateY(20px);opacity:0}
.mini-in{pointer-events:auto;max-width:540px;margin:0 auto;display:grid;grid-template-columns:42px minmax(0,1fr) 40px 40px;gap:10px;align-items:center;
  padding:8px 8px 8px 8px;border-radius:16px;background:color-mix(in srgb,var(--paper) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 4px 24px rgba(0,0,0,.10),0 0 0 .5px var(--sep)}
.mini .art{width:42px;height:42px;border-radius:9px;font-size:14px}
.mini-txt{min-width:0;text-align:left}
.mini-t{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-s{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.mini-s span{overflow:hidden;text-overflow:ellipsis}
.mini-s.live{color:var(--live)}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.ibtn .ic{width:24px;height:24px}
.ibtn:disabled{opacity:.35}

/* Barra de abas translúcida (iOS) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--paper) 84%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:grid;justify-items:center;gap:1px;padding:7px 0 5px;color:var(--ink-3);font-size:10.5px;font-weight:500}
.tab .ic{width:26px;height:26px;stroke-width:1.6}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ic.fillable{fill:currentColor}

/* Folhas (sheets) */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;width:100%;max-width:560px;margin:0 auto;max-height:92dvh;display:flex;flex-direction:column;
  background:var(--bg);border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .42s var(--ease);will-change:transform}
.sheet.open{transform:none}
.sheet::before{content:"";flex:none;display:block;width:36px;height:5px;margin:0 auto 4px;border-radius:3px;background:rgba(60,60,67,.28)}
.sheet-h{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px 12px}
.sheet-h h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.link{color:var(--accent);font-size:15px;font-weight:600;padding:6px 0}
.sheet .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 8px}
.clist{list-style:none;margin:0 0 14px;padding:0 14px}
.crow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border-bottom:.5px solid var(--sep);text-align:left}
.clist li:last-child .crow{border-bottom:0}
.crow .n{flex:1;font-size:16px}
.crow .c{font-size:13px;color:var(--muted)}
.crow .ok{width:18px;height:18px;color:var(--accent);stroke-width:2.4}
.cap{margin:14px 4px 6px;font-size:12.5px;font-weight:500;color:var(--muted)}

/* Player em tela cheia (modo carro) */
.player{height:96dvh;max-height:none}
.pl-h{flex:none;display:flex;justify-content:space-between;align-items:center;padding-block:4px 0}
.pl-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.pl-art{width:min(78vw,40dvh,340px);height:min(78vw,40dvh,340px);border-radius:24px;font-size:72px;
  box-shadow:0 18px 50px rgba(0,0,0,.18);transition:transform .4s var(--ease)}
.pl-art.paused{transform:scale(.86)}
.pl-txt{width:100%;min-width:0}
.pl-k{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pl-k.live{color:var(--live)}
.pl-t{margin:6px 0 2px;font-family:var(--display);font-size:clamp(24px,6.6vw,32px);font-weight:700;letter-spacing:-.025em;line-height:1.15;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-a{font-size:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-st{margin-top:6px;font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-ctl{flex:none;display:flex;justify-content:center;align-items:center;gap:clamp(20px,8vw,52px);padding:10px 0 6px}
.pl-ctl .ibtn{width:76px;height:76px}
.pl-ctl .ibtn .ic{width:40px;height:40px}
.pl-ctl .big{width:96px;height:96px;background:var(--accent);color:var(--accent-ink)}
.pl-ctl .big .ic{width:44px;height:44px}
.pl-aux{flex:none;display:flex;justify-content:center;gap:28px;padding-bottom:4px}
.pl-aux button{display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);min-width:64px}
.pl-aux .ic{width:24px;height:24px}
.pl-aux .fav{color:#D69E2E}
.pl-aux .fav .ic{fill:currentColor}
@media (orientation:landscape) and (max-height:540px){
  .pl-body{flex-direction:row;gap:28px;text-align:left}
  .pl-art{width:min(36dvh,200px);height:min(36dvh,200px);font-size:48px}
  .pl-ctl{padding:4px 0}
  .pl-ctl .ibtn{width:64px;height:64px}.pl-ctl .big{width:80px;height:80px}
}

.toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:40;transform:translate(-50%,10px);opacity:0;
  max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;
  transition:.25s var(--ease);pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── VINHETA ─────────────────────────────────────────────────────────
   Mesmo padrão da abertura do wirteilen, com a marca do Rádio Mundo:
   o ponto aparece, as barras do equalizador crescem em volta, em sequência,
   batem uma vez no ritmo e um anel se expande. Só SVG e CSS.
   Duração total 1,8 s — é o contrato com DUR no script logo após #splash. */
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--bg) 0%,var(--paper) 55%,var(--line) 100%);transition:opacity .5s ease,transform .5s ease}
#splash.hide{opacity:0;transform:translateY(-12px);pointer-events:none}
.vin{display:block;width:150px;height:150px;overflow:visible}
.vb{fill:none;stroke-width:20;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:vinCresce .42s cubic-bezier(.36,.7,.3,1) forwards;animation-delay:calc(.2s + var(--i) * 14ms)}
@keyframes vinCresce{to{stroke-dashoffset:0}}
.vbars{transform-origin:512px 512px;animation:vinBate .46s cubic-bezier(.34,1.5,.5,1) 1.02s}
@keyframes vinBate{45%{transform:scale(1.08)}}
.vin-ponto{fill:#1D1D1F;opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:vinPonto .34s cubic-bezier(.34,1.5,.5,1) .05s forwards}
@media (prefers-color-scheme: dark){.vin-ponto{fill:#F5F5F7}}
@keyframes vinPonto{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.vin-halo{fill:none;stroke:var(--accent);stroke-width:6;opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:vinHalo .9s ease-out 1.1s forwards}
@keyframes vinHalo{0%{opacity:.6;transform:scale(.8)}100%{opacity:0;transform:scale(4.6)}}
.splash-name{margin-top:22px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;opacity:0;animation:vinNome .5s ease .7s forwards}
.splash-rule{width:58px;height:2px;margin-top:12px;border-radius:1px;background:var(--line)}
@keyframes vinNome{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .vb{stroke-dashoffset:0;animation:none}.vbars,.vin-halo{animation:none}
  .vin-ponto,.splash-name{opacity:1;animation:none}
  .eq i{animation:none}
}
</style>

      <span class="pl-k" id="plK"></span>

<!-- Países -->

  <div class="sheet-h"><h2>País</h2><button class="link" id="cClose">OK</button></div>
  <div class="search" style="flex:none;margin-bottom:6px"><svg class="ic"><use href="#i-search"/></svg>
    <input id="cq" type="search" placeholder="Filtrar países" autocomplete="off"></div>
  <div class="scroll" id="cList"></div>
</section>

<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="none" playsinline></audio>

<script>
(() => {
'use strict';
const ICON = document.querySelector('link[rel=apple-touch-icon]').href;
document.getElementById('eyeIcon').src = ICON;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico = (n, cls='') => `<svg class="ic ${cls}"><use href="#i-${n}"/></svg>`;
const EQ = (on=true) => `<span class="eq${on?'':' off'}"><i></i><i></i><i></i></span>`;
const store = {
  get(k, d){ try { const v = localStorage.getItem('radio.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('radio.'+k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- Países ---------- */
let RN; try { RN = new Intl.DisplayNames(['pt-BR'], {type:'region'}); } catch(e){}
const cName = cc => { if (!cc) return 'Mundo todo'; try { return RN?.of(cc.toUpperCase()) || cc; } catch(e){ return cc; } };
const flag = cc => cc ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '🌍';
const PINNED = ['DE','AT','CH','BR','PT','US','GB','FR','IT','ES','NL'];
const GENRES = [['','Todas'],['pop','Pop'],['rock','Rock'],['news','Notícias'],['schlager','Schlager'],['80s','Anos 80'],
  ['hits','Hits'],['jazz','Jazz'],['classical','Clássica'],['electronic','Eletrônica'],['oldies','Oldies'],['chillout','Chill']];

/* ---------- API pública radio-browser.info ---------- */
const HOSTS = ['https://de1.api.radio-browser.info','https://de2.api.radio-browser.info','https://fi1.api.radio-browser.info',
  'https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info'];
let host = store.get('host', null);
function timed(ms){ const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return {signal:c.signal, done:() => clearTimeout(t), ctrl:c}; }
async function api(path){
  const order = host ? [host, ...HOSTS.filter(h => h !== host)] : HOSTS.slice().sort(() => Math.random() - .5);
  for (const h of order){
    const t = timed(8000);
    try {
      const r = await fetch(h + path, {signal:t.signal}); t.done();
      if (!r.ok) continue;
      const j = await r.json();
      if (host !== h){ host = h; store.set('host', h); }
      return j;
    } catch(e){ t.done(); }
  }
  throw new Error('offline');
}
const norm = s => ({
  id: s.stationuuid, name: (s.name || '').trim().replace(/\s+/g,' '), url: s.url_resolved || s.url,
  favicon: /^https:\/\//.test(s.favicon || '') ? s.favicon : '', cc: (s.countrycode || '').toUpperCase(),
  tags: (s.tags || '').split(',').map(t => t.trim()).filter(t => t && t.length < 20).slice(0, 3),
  bitrate: s.bitrate || 0, codec: (s.codec || '').toUpperCase(), clicks: s.clickcount || 0
});
// No iPhone via GitHub Pages: só HTTPS e formatos que o Safari toca
const playable = s => s.name && s.url && /^https:\/\//i.test(s.url) && !/OGG|FLAC|UNKNOWN/.test(s.codec);
function clean(arr){
  const seen = new Set(), out = [];
  for (const s of arr.map(norm)){
    if (!playable(s)) continue;
    const k = s.name.toLowerCase() + '|' + s.cc;
    if (seen.has(k)) continue; seen.add(k); out.push(s);
  }
  return out;
}
async function searchStations({country, tag, name}){
  const p = new URLSearchParams({order:'clickcount', reverse:'true', hidebroken:'true', limit:'200'});
  if (country) p.set('countrycode', country);
  if (name){
    const q = encodeURIComponent(name);
    const [a, b] = await Promise.all([api('/json/stations/search?' + p + '&name=' + q), api('/json/stations/search?' + p + '&tag=' + q).catch(() => [])]);
    return clean([...a, ...b].sort((x, y) => (y.clickcount || 0) - (x.clickcount || 0))).slice(0, 100);
  }
  if (tag) p.set('tag', tag);
  return clean(await api('/json/stations/search?' + p)).slice(0, 120);
}

/* ---------- Estado ---------- */
const S = {
  tab:'all', country: store.get('country','DE'), genre:'', stations:[], loading:true, error:false,
  q:'', scope:'country', results:[], sLoading:false, sError:false,
  favs: store.get('favs', []), cur: store.get('last', null), queue:[], status:'idle',
  np:null   // {artist, title, raw, cover}
};
let rAll = 0, rSearch = 0, heroIn = false;

async function loadAll(){
  const my = ++rAll; S.loading = true; renderAll();
  try { const r = await searchStations({country:S.country, tag:S.genre}); if (my !== rAll) return; S.stations = r; S.error = false; }
  catch(e){ if (my !== rAll) return; S.stations = []; S.error = true; }
  S.loading = false; renderAll();
}
async function runSearch(){
  const my = ++rSearch;
  if (!S.q){ S.results = []; S.sLoading = false; renderSearch(); return; }
  S.sLoading = true; renderSearch();
  try { const r = await searchStations({country: S.scope === 'country' ? S.country : '', name:S.q}); if (my !== rSearch) return; S.results = r; S.sError = false; }
  catch(e){ if (my !== rSearch) return; S.results = []; S.sError = true; }
  S.sLoading = false; renderSearch();
}

/* ---------- Peças visuais ---------- */
const COLORS = ['var(--m1)','var(--m2)','var(--m3)','var(--m4)','var(--m5)'];
const hue = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return COLORS[Math.abs(h) % COLORS.length]; };
const initials = n => (n.replace(/[^\p{L}\p{N} ]/gu,'').trim().split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('') || '♪').toUpperCase();
function artHTML(s, cover){
  if (cover) return `<img class="cover" src="${esc(cover)}" alt="" referrerpolicy="no-referrer">`;
  const ini = esc(initials(s.name));
  return s.favicon ? `<img src="${esc(s.favicon)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">${ini}` : ini;
}
function setArt(el, s, cover){ el.style.setProperty('--c', hue(s.name)); el.innerHTML = artHTML(s, cover); }
const isFav = id => S.favs.some(f => f.id === id);
const subOf = (s, showFlag) => [showFlag ? flag(s.cc) : '', s.tags.join(' · '), s.bitrate ? s.bitrate + ' kbps' : ''].filter(Boolean).join('  ·  ');
const playing = () => S.status === 'playing' || S.status === 'loading';

function rowsHTML(items, showFlag, list){
  const cur = S.cur?.id;
  return items.map((s, i) => `
    <li class="row${s.id === cur ? ' on' : ''}">
      <button class="hit" data-list="${list}" data-i="${i}">
        <span class="art" style="--c:${hue(s.name)}">${artHTML(s)}</span>
        <span class="row-main"><span class="row-t">${s.id === cur ? EQ(S.status === 'playing') : ''}<span>${esc(s.name)}</span></span>
        <span class="row-s">${esc(subOf(s, showFlag))}</span></span>
      </button>
      <button class="star${isFav(s.id) ? ' fav' : ''}" data-list="${list}" data-f="${i}" aria-label="Favoritar">${ico('star')}</button>
    </li>`).join('');
}
const skel = n => Array.from({length:n}, () => '<li class="skel"><i></i><span><em></em><em></em></span></li>').join('');
const emptyHTML = (icon, t, p) => `<li class="empty">${ico(icon)}<b>${t}</b><p>${p}</p></li>`;

/* ---------- Render ---------- */
function renderHeader(){
  $('title').textContent = {all:'Estações', search:'Buscar', fav:'Favoritas'}[S.tab];
  $('cFlag').textContent = flag(S.country); $('cName').textContent = cName(S.country);
  document.querySelectorAll('.tab').forEach(t => t.dataset.tab === S.tab ? t.setAttribute('aria-current','page') : t.removeAttribute('aria-current'));
  $('vAll').hidden = S.tab !== 'all'; $('vSearch').hidden = S.tab !== 'search'; $('vFav').hidden = S.tab !== 'fav';
}
function renderHero(){
  const s = S.cur, h = $('hero');
  if (!s){
    h.innerHTML = `<div class="hero">
      <div class="hero-top" style="grid-template-columns:minmax(0,1fr)">
        <div><span class="hero-k">${flag(S.country)} ${esc(cName(S.country))}</span>
        <span class="hero-t">Escolha uma rádio</span><span class="hero-s">As mais ouvidas agora, ao vivo.</span></div>
      </div>
      <div class="hero-kpis"><div><span>Estações</span><b>${S.loading ? '—' : S.stations.length}</b></div>
        <div><span>Favoritas</span><b>${S.favs.length}</b></div><div><span>País</span><b>${esc(cName(S.country))}</b></div></div></div>`;
    return;
  }
  const live = S.status === 'playing';
  const k = {idle:'Pausado', loading:'Conectando…', playing:'Ao vivo', error:'Indisponível'}[S.status];
  const t = S.np ? S.np.title : s.name;
  const sub = S.np ? [S.np.artist, s.name].filter(Boolean).join(' · ') : (s.tags.join(' · ') || cName(s.cc));
  h.innerHTML = `<div class="hero" role="button" tabindex="0" id="heroCard">
    <div class="hero-top">
      <span class="art" id="hArt"></span>
      <div style="min-width:0"><span class="hero-k${live ? ' live' : ''}">${live ? EQ() : ''}${k}</span>
        <span class="hero-t">${esc(t)}</span><span class="hero-s">${esc(sub)}</span></div>
      <button class="hero-play" id="hPlay" aria-label="${playing() ? 'Pausar' : 'Tocar'}">${ico(playing() ? 'pause' : 'play')}</button>
    </div>
    <div class="hero-kpis"><div><span>Rádio</span><b>${esc(s.name)}</b></div>
      <div><span>País</span><b>${flag(s.cc)} ${esc(cName(s.cc))}</b></div><div><span>Qualidade</span><b>${s.bitrate ? s.bitrate + ' kbps' : (s.codec || '—')}</b></div></div></div>`;
  setArt($('hArt'), s, S.np?.cover);
}
function renderAll(){
  renderHeader(); renderHero();
  $('chips').innerHTML = GENRES.map(([t, l]) => `<button class="chip" data-g="${t}" aria-pressed="${S.genre === t}">${l}</button>`).join('');
  $('secT').textContent = S.genre ? GENRES.find(g => g[0] === S.genre)[1] : 'Mais ouvidas';
  $('secN').textContent = S.loading ? '' : S.stations.length + ' estações';
  const l = $('lAll');
  if (S.loading) l.innerHTML = skel(6);
  else if (S.error) l.innerHTML = emptyHTML('radio', 'Sem conexão', 'Não consegui carregar as rádios. Verifique a internet e toque no país de novo.');
  else if (!S.stations.length) l.innerHTML = emptyHTML('radio', 'Nada por aqui', 'Esse gênero não tem rádios compatíveis nesse país. Tente outro.');
  else l.innerHTML = rowsHTML(S.stations, !S.country, 'all');
}
function renderSearch(){
  renderHeader();
  $('qx').hidden = !S.q;
  $('scope').innerHTML = `<button role="tab" data-s="country" aria-selected="${S.scope==='country'}">${flag(S.country)} ${esc(cName(S.country))}</button>
    <button role="tab" data-s="world" aria-selected="${S.scope==='world'}">🌍 Mundo todo</button>`;
  const w = $('sWrap');
  if (!S.q){ w.innerHTML = `<p class="hint">Busque pelo nome (ex.: “Antenne”), pela cidade (ex.: “Berlin”) ou pelo gênero (ex.: “jazz”).</p>`; return; }
  if (S.sLoading){ w.innerHTML = `<div class="sec"><span>Resultados</span></div><ul class="card list">${skel(4)}</ul>`; return; }
  if (S.sError){ w.innerHTML = `<ul class="card list" style="margin-top:14px">${emptyHTML('radio','Sem conexão','Não consegui buscar agora. Tente de novo em instantes.')}</ul>`; return; }
  if (!S.results.length){ w.innerHTML = `<ul class="card list" style="margin-top:14px">${emptyHTML('search','Nada encontrado', S.scope==='country' ? 'Tente “Mundo todo” ou outro termo.' : 'Tente outro nome ou gênero.')}</ul>`; return; }
  w.innerHTML = `<div class="sec"><span>Resultados</span><span class="num">${S.results.length}</span></div><ul class="card list">${rowsHTML(S.results, true, 'search')}</ul>`;
}
function renderFav(){
  renderHeader();
  $('favN').textContent = S.favs.length ? S.favs.length + (S.favs.length > 1 ? ' rádios' : ' rádio') : '';
  $('lFav').innerHTML = S.favs.length ? rowsHTML(S.favs, true, 'fav')
    : emptyHTML('star', 'Nenhuma favorita ainda', 'Toque na estrela ao lado de uma rádio para guardar aqui.');
}
function renderPlayer(){
  const s = S.cur;
  $('mini').classList.toggle('away', !s || (heroIn && S.tab === 'all'));
  if (!s) return;
  const live = S.status === 'playing';
  const k = {idle:'Pausado', loading:'Conectando…', playing:'Ao vivo', error:'Indisponível'}[S.status];
  const pi = ico(playing() ? 'pause' : 'play');
  // mini
  setArt($('mArt'), s, S.np?.cover);
  $('mT').textContent = S.np ? S.np.title : s.name;
  $('mS').className = 'mini-s' + (live ? ' live' : '');
  $('mS').innerHTML = (live ? EQ() : '') + `<span>${esc(S.np ? [S.np.artist, s.name].filter(Boolean).join(' · ') : k)}</span>`;
  $('mPlay').innerHTML = pi; $('mPlay').setAttribute('aria-label', playing() ? 'Pausar' : 'Tocar');
  // tela cheia
  setArt($('plArt'), s, S.np?.cover);
  $('plArt').classList.toggle('paused', !live);
  $('plK').className = 'pl-k' + (live ? ' live' : ''); $('plK').innerHTML = (live ? EQ() : '') + k;
  $('plT').textContent = S.np ? S.np.title : s.name;
  $('plA').textContent = S.np ? (S.np.artist || '') : (s.tags.join(' · ') || '');
  $('plSt').textContent = S.np ? s.name : (s.bitrate ? s.bitrate + ' kbps · ' + (s.codec || '') : '');
  $('plCountry').textContent = flag(s.cc) + ' ' + cName(s.cc);
  $('pPlay').innerHTML = pi;
  $('pFav').classList.toggle('fav', isFav(s.id));
}
function render(){
  if (S.tab === 'all') renderAll(); else if (S.tab === 'search') renderSearch(); else renderFav();
  renderPlayer();
}

/* ---------- Player ---------- */
const audio = $('audio');
function setStatus(st){ S.status = st; render(); syncSession(); }
function play(s, queue){
  if (!s) return;
  const changed = S.cur?.id !== s.id;
  S.cur = s;
  if (queue) S.queue = queue.slice();
  if (!S.queue.some(q => q.id === s.id)) S.queue = [s];
  store.set('last', s);
  if (changed) S.np = null;
  audio.src = s.url;
  setStatus('loading');
  audio.play().catch(err => { if (err.name !== 'AbortError') fail(); });
  api('/json/url/' + s.id).catch(() => {});   // conta o clique na base pública
  setMeta(); NP.start(s);
}
function stop(){ audio.pause(); audio.removeAttribute('src'); audio.load(); NP.stop(); setStatus('idle'); }
function toggle(){
  if (!S.cur) return;
  if (playing()) stop();
  else play(S.cur, S.queue.length ? null : (isFav(S.cur.id) ? S.favs : S.stations));
}
function step(d){
  if (!S.cur) return;
  const q = S.queue.length ? S.queue : (S.favs.length ? S.favs : S.stations);
  if (!q.length) return;
  const i = q.findIndex(x => x.id === S.cur.id);
  play(q[(i + d + q.length) % q.length], q);
}
function fail(){ if (!S.cur) return; NP.stop(); setStatus('error'); toast('Essa rádio não respondeu. Tente a próxima.'); }
audio.addEventListener('playing', () => setStatus('playing'));
audio.addEventListener('waiting', () => { if (S.status === 'playing') setStatus('loading'); });
audio.addEventListener('error', () => { if (audio.getAttribute('src')) fail(); });
audio.addEventListener('pause', () => { if (S.status === 'playing'){ NP.stop(); setStatus('idle'); } });

/* ---------- Tela de bloqueio, volante e CarPlay (Tocando agora) ---------- */
function setMeta(){
  if (!('mediaSession' in navigator) || !S.cur) return;
  const s = S.cur, np = S.np;
  const art = [];
  if (np?.cover) art.push({src: np.cover, sizes:'600x600', type:'image/jpeg'});
  if (s.favicon) art.push({src: s.favicon, sizes:'256x256'});
  art.push({src: ICON, sizes:'180x180', type:'image/png'});
  try {
    navigator.mediaSession.metadata = new MediaMetadata(np
      ? {title: np.title, artist: np.artist || s.name, album: s.name + ' · ' + cName(s.cc), artwork: art}
      : {title: s.name, artist: [cName(s.cc), s.tags.slice(0,2).join(', ')].filter(Boolean).join(' · '), album: 'Rádio Mundo', artwork: art});
  } catch(e){}
}
function syncSession(){ try { navigator.mediaSession.playbackState = playing() ? 'playing' : 'paused'; } catch(e){} }
if ('mediaSession' in navigator){
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch(e){} };
  set('play', () => { if (!playing()) toggle(); });
  set('pause', () => { if (playing()) toggle(); });
  set('stop', () => { if (playing()) toggle(); });
  set('nexttrack', () => step(1));
  set('previoustrack', () => step(-1));
}

/* ---------- Música atual ----------
   Rádios na internet mandam o nome da música junto com o áudio (metadados ICY).
   O navegador só consegue ler quando o servidor da rádio permite (CORS), então
   é melhor esforço: tenta a página de status do Icecast e depois o próprio stream.
   Quando acha, busca a capa do disco no catálogo da Apple (iTunes Search). */
const NP = (() => {
  let timer = null, sid = null, misses = 0, ctrl = null;
  const coverCache = {};
  async function viaStatus(s){
    const u = new URL(s.url);
    const t = timed(5000); ctrl = t.ctrl;
    try {
      const r = await fetch(u.origin + '/status-json.xsl', {signal:t.signal, cache:'no-store'}); t.done();
      if (!r.ok) return null;
      const j = JSON.parse((await r.text()).replace(/"title":\s*-\s*,/g, '"title":null,'));
      let src = j?.icestats?.source; if (!src) return null;
      if (!Array.isArray(src)) src = [src];
      const m = src.find(x => x.listenurl && new URL(x.listenurl, u.origin).pathname === u.pathname) || (src.length === 1 ? src[0] : null);
      if (!m) return null;
      const title = m.title || m.yp_currently_playing || '';
      return m.artist && title && !title.includes(' - ') ? m.artist + ' - ' + title : title;
    } catch(e){ t.done(); return null; }
  }
  async function viaIcy(s){
    const t = timed(9000); ctrl = t.ctrl;
    try {
      const r = await fetch(s.url, {headers:{'Icy-MetaData':'1'}, signal:t.signal, cache:'no-store'});
      const mi = parseInt(r.headers.get('icy-metaint') || '0', 10);
      if (!r.ok || !mi || !r.body){ t.ctrl.abort(); t.done(); return null; }
      const rd = r.body.getReader();
      let skip = mi, need = -1, buf = [];
      while (true){
        const {value, done} = await rd.read(); if (done) break;
        let p = 0;
        while (p < value.length){
          if (skip > 0){ const n = Math.min(skip, value.length - p); skip -= n; p += n; continue; }
          if (need < 0){ need = value[p++] * 16; if (need === 0){ skip = mi; need = -1; } continue; }
          const n = Math.min(need - buf.length, value.length - p);
          for (let k = 0; k < n; k++) buf.push(value[p + k]);
          p += n;
          if (buf.length >= need){
            t.ctrl.abort(); t.done();
            const bytes = new Uint8Array(buf);
            let txt = new TextDecoder('utf-8').decode(bytes);
            if (txt.includes('�')) txt = new TextDecoder('iso-8859-1').decode(bytes);
            const m = txt.match(/StreamTitle='(.*?)';/s);
            return m ? m[1] : '';
          }
        }
      }
      t.done(); return null;
    } catch(e){ t.done(); return null; }
  }
  function parse(raw, s){
    raw = (raw || '').replace(/\s+/g, ' ').trim();
    if (!raw || raw.length < 3 || raw === '-' ) return null;
    const lo = raw.toLowerCase(), sn = s.name.toLowerCase();
    if (lo === sn || sn.includes(lo) || /^(werbung|advert|news|nachrichten|jingle|unknown|live)\b/i.test(lo)) return null;
    const i = raw.indexOf(' - ');
    return i > 0 ? {artist: raw.slice(0, i).trim(), title: raw.slice(i + 3).trim(), raw} : {artist:'', title: raw, raw};
  }
  function jsonp(url){
    return new Promise((res, rej) => {
      const cb = '__it' + Math.random().toString(36).slice(2, 9), sc = document.createElement('script');
      const end = () => { clearTimeout(to); delete window[cb]; sc.remove(); };
      const to = setTimeout(() => { end(); rej(); }, 6000);
      window[cb] = d => { end(); res(d); };
      sc.onerror = () => { end(); rej(); };
      sc.src = url + '&callback=' + cb; document.head.appendChild(sc);
    });
  }
  async function cover(np){
    if (!np.artist) return null;
    const key = np.raw.toLowerCase();
    if (key in coverCache) return coverCache[key];
    try {
      const term = encodeURIComponent((np.artist + ' ' + np.title).replace(/\(.*?\)|feat\..*/gi, '').slice(0, 80));
      const d = await jsonp('https://itunes.apple.com/search?media=music&entity=song&limit=1&term=' + term);
      const a = d?.results?.[0]?.artworkUrl100;
      return coverCache[key] = a ? a.replace('100x100bb', '600x600bb') : null;
    } catch(e){ return coverCache[key] = null; }
  }
  async function poll(){
    const s = S.cur; if (!s || s.id !== sid || !playing()) return;
    let raw = await viaStatus(s);
    if (raw == null && s.id === sid) raw = await viaIcy(s);
    if (!S.cur || S.cur.id !== sid) return;
    if (raw == null){ if (++misses >= 2) stop(); return; }   // rádio não libera os dados: desiste em silêncio
    misses = 0;
    const np = parse(raw, s);
    if ((np?.raw || null) === (S.np?.raw || null)) return;
    S.np = np; setMeta(); renderPlayer(); if (S.tab === 'all') renderHero();
    if (np){ const c = await cover(np); if (S.np === np && c){ np.cover = c; setMeta(); renderPlayer(); if (S.tab === 'all') renderHero(); } }
  }
  function start(s){ stop(); sid = s.id; misses = 0; setTimeout(poll, 1500); timer = setInterval(poll, 20000); }
  function stop(){ clearInterval(timer); timer = null; try { ctrl?.abort(); } catch(e){} }
  return {start, stop};
})();

/* ---------- Favoritas ---------- */
function toggleFav(s){
  const i = S.favs.findIndex(f => f.id === s.id);
  if (i >= 0){ S.favs.splice(i, 1); toast('Removida das favoritas'); }
  else { S.favs.push(s); toast('Adicionada às favoritas'); }
  store.set('favs', S.favs);
  render();
}

/* ---------- Folhas ---------- */
let openSheetEl = null;
function openSheet(el){ openSheetEl = el; el.classList.add('open'); $('scrim').classList.add('open'); }
function closeSheet(){ if (!openSheetEl) return; openSheetEl.classList.remove('open'); $('scrim').classList.remove('open'); openSheetEl = null; }
let countries = null;
async function openCountries(){
  $('cq').value = ''; openSheet($('csheet'));
  if (!countries){
    $('cList').innerHTML = `<ul class="card clist">${skel(6)}</ul>`;
    try {
      const data = await api('/json/countries?hidebroken=true');
      const map = {};
      data.forEach(c => { const cc = (c.iso_3166_1 || '').toUpperCase(); if (cc.length === 2) map[cc] = (map[cc] || 0) + c.stationcount; });
      countries = Object.entries(map).filter(([, n]) => n > 0).map(([cc, n]) => ({cc, n, name: cName(cc)})).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    } catch(e){ countries = PINNED.map(cc => ({cc, n:0, name:cName(cc)})); }
  }
  renderCountries('');
}
function renderCountries(f){
  const nz = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(), nf = nz(f);
  const row = c => `<li><button class="crow" data-cc="${c.cc}"><span class="flag">${flag(c.cc)}</span><span class="n">${esc(c.name)}</span>
    ${c.cc === S.country ? ico('check','ok') : (c.n ? `<span class="c">${c.n.toLocaleString('pt-BR')}</span>` : '')}</button></li>`;
  let h = '';
  if (!nf){
    h += `<div class="cap">Atalhos</div><ul class="card clist">${[{cc:'', n:0, name:'Mundo todo'}, ...PINNED.map(cc => countries.find(c => c.cc === cc) || {cc, n:0, name:cName(cc)})].map(row).join('')}</ul>`;
    h += `<div class="cap">Todos os países</div>`;
  }
  const all = countries.filter(c => !nf || nz(c.name).includes(nf) || c.cc.toLowerCase() === nf);
  h += all.length ? `<ul class="card clist">${all.map(row).join('')}</ul>` : `<ul class="card clist">${emptyHTML('search','Nenhum país encontrado','Confira a grafia.')}</ul>`;
  $('cList').innerHTML = h;
}

/* ---------- AirPlay (Safari) ---------- */
if (window.WebKitPlaybackTargetAvailabilityEvent){
  audio.addEventListener('webkitplaybacktargetavailabilitychanged', e => { $('pAir').hidden = e.availability !== 'available'; });
  $('pAir').addEventListener('click', () => { try { audio.webkitShowPlaybackTargetPicker(); } catch(e){} });
}

/* ---------- Toast ---------- */
let tt;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- Eventos ---------- */
const listOf = k => k === 'all' ? S.stations : k === 'search' ? S.results : S.favs;
document.addEventListener('click', e => {
  const f = e.target.closest('[data-f]');
  if (f){ toggleFav(listOf(f.dataset.list)[+f.dataset.f]); return; }
  const h = e.target.closest('.hit');
  if (h){
    const items = listOf(h.dataset.list), s = items[+h.dataset.i];
    if (S.cur?.id === s.id && S.status !== 'error') { if (playing()) openSheet($('player')); else toggle(); }
    else play(s, items);
    return;
  }
  if (e.target.closest('#hPlay')){ e.stopPropagation(); toggle(); return; }
  if (e.target.closest('#heroCard')){ openSheet($('player')); return; }
});
$('chips').addEventListener('click', e => { const c = e.target.closest('[data-g]'); if (!c) return; S.genre = c.dataset.g; loadAll(); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  S.tab = t.dataset.tab; window.scrollTo({top:0}); render();
  if (S.tab === 'all' && (S.error || !S.stations.length) && !S.loading) loadAll();
}));
let qt;
$('q').addEventListener('input', e => { S.q = e.target.value.trim(); $('qx').hidden = !S.q; clearTimeout(qt); qt = setTimeout(runSearch, 400); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('qx').addEventListener('click', () => { $('q').value = ''; S.q = ''; runSearch(); $('q').focus(); });
$('scope').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; S.scope = b.dataset.s; runSearch(); });
$('countryBtn').addEventListener('click', openCountries);
$('cClose').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
$('cq').addEventListener('input', e => renderCountries(e.target.value.trim()));
$('cList').addEventListener('click', e => {
  const b = e.target.closest('[data-cc]'); if (!b) return;
  S.country = b.dataset.cc; store.set('country', S.country); closeSheet();
  if (S.tab === 'search') runSearch(); else { S.tab = 'all'; window.scrollTo({top:0}); }
  loadAll();
});
$('mPlay').addEventListener('click', toggle); $('pPlay').addEventListener('click', toggle);
$('mNext').addEventListener('click', () => step(1)); $('pNext').addEventListener('click', () => step(1));
$('pPrev').addEventListener('click', () => step(-1));
$('mArt').addEventListener('click', () => openSheet($('player'))); $('mTxt').addEventListener('click', () => openSheet($('player')));
$('plClose').addEventListener('click', closeSheet);
$('pFav').addEventListener('click', () => S.cur && toggleFav(S.cur));
// arrastar para baixo fecha a folha
document.querySelectorAll('.sheet').forEach(sh => {
  let y0 = null;
  sh.addEventListener('touchstart', e => { const sc = e.target.closest('.scroll'); y0 = (!sc || sc.scrollTop <= 0) ? e.touches[0].clientY : null; }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 0){ sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; } }, {passive:true});
  sh.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transition = ''; sh.style.transform = ''; y0 = null; if (dy > 110) closeSheet(); });
});

/* Mini player some enquanto o cartão escuro estiver visível */
if ('IntersectionObserver' in window)
  new IntersectionObserver(([en]) => { heroIn = en.isIntersecting; renderPlayer(); }, {threshold:.3}).observe($('hero'));

/* ---------- Início ---------- */
if (S.cur) setMeta();
render();
loadAll();
window.__splashDone && window.__splashDone();
})();
</script>
