<style>
:root{
  --bg:#EFECE6; --surface:#F8F6F2; --ink:#1A1A1A; --muted:#6E6A63; --line:#DAD5CC;
  --accent:#B8442F; --ochre:#C9A13B; --chip:#E4E0D8; --shadow:0 -6px 24px rgba(0,0,0,.08);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121212; --surface:#1C1C1B; --ink:#EDEAE4; --muted:#9A958C; --line:#2E2D2A;
    --accent:#D25B43; --ochre:#D4AE4A; --chip:#262523; --shadow:0 -6px 24px rgba(0,0,0,.5);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Jost,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:16px;
  min-height:100vh;padding-top:var(--safe-t);padding-bottom:calc(104px + var(--safe-b));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* Header */
header{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.logo{width:34px;height:34px;flex:none}
h1{font-size:22px;font-weight:600;letter-spacing:.02em;margin:0;flex:1;white-space:nowrap}
.country-btn{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1.5px solid var(--ink);
  border-radius:0;font-weight:500;max-width:52vw}
.country-btn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag{font-size:20px;line-height:1}

/* Tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);margin-bottom:12px}
.tabs button{height:44px;font-weight:500;letter-spacing:.03em}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}

/* Search */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:48px;border:0;border-bottom:1.5px solid var(--line);background:transparent;
  padding:0 40px 0 34px;font-size:17px;outline:none;border-radius:0}
.search input:focus{border-bottom-color:var(--ink)}
.search svg{position:absolute;left:4px;top:14px;width:20px;height:20px;stroke:var(--muted)}
.search .clear{position:absolute;right:0;top:4px;width:40px;height:40px;color:var(--muted);font-size:22px;display:none}
.search.has .clear{display:block}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;background:var(--chip);font-size:14px;font-weight:500;letter-spacing:.02em}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}

/* List */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;min-height:70px;border-bottom:1px solid var(--line)}
.row .hit{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:10px 0}
.thumb{width:48px;height:48px;flex:none;background:var(--chip);display:grid;place-items:center;overflow:hidden;
  font-weight:600;font-size:17px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.info{min-width:0;flex:1}
.name{font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.on .name{color:var(--accent)}
.row.on .thumb{outline:2px solid var(--accent);outline-offset:2px}
.star{width:48px;height:48px;flex:none;display:grid;place-items:center}
.star svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:1.6}
.star.fav svg{fill:var(--ochre);stroke:var(--ochre)}
.empty{padding:48px 8px;text-align:center;color:var(--muted);line-height:1.5}
.empty b{display:block;color:var(--ink);font-weight:500;font-size:18px;margin-bottom:4px}
.loading{padding:40px 0;display:grid;place-items:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

/* Player bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);box-shadow:var(--shadow);
  padding:12px 16px calc(12px + var(--safe-b));z-index:10}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .now{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.bar .thumb{width:52px;height:52px}
.ctl{width:52px;height:52px;flex:none;display:grid;place-items:center}
.ctl svg{width:26px;height:26px;fill:var(--ink)}
.ctl.main{background:var(--ink);border-radius:50%}
.ctl.main svg{fill:var(--bg)}
.ctl:disabled{opacity:.35}
.status{font-size:13px;color:var(--muted);margin-top:2px}
.status.live{color:var(--accent)}
.status.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

/* Car mode */
.car{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;
  padding:calc(16px + var(--safe-t)) 24px calc(24px + var(--safe-b))}
.car.open{display:flex}
.car .top{display:flex;justify-content:space-between;align-items:center}
.car .close{width:52px;height:52px;display:grid;place-items:center}
.car .close svg{width:28px;height:28px;stroke:var(--ink);stroke-width:2;fill:none}
.car .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;min-height:0}
.car .art{width:min(56vw,42vh,280px);aspect-ratio:1;background:var(--chip);display:grid;place-items:center;overflow:hidden;
  font-size:72px;font-weight:600;color:var(--muted)}
.car .art img{width:100%;height:100%;object-fit:contain;background:#fff}
.car .title{font-size:clamp(26px,6vw,40px);font-weight:600;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.car .sub{color:var(--muted);font-size:17px}
.car .controls{display:flex;justify-content:center;align-items:center;gap:clamp(16px,6vw,48px)}
.car .ctl{width:88px;height:88px}
.car .ctl svg{width:44px;height:44px}
.car .ctl.main{width:120px;height:120px}
.car .ctl.main svg{width:56px;height:56px}
.car .star{width:56px;height:56px}
.car .star svg{width:30px;height:30px}
@media (orientation:landscape) and (max-height:520px){
  .car .body{flex-direction:row;gap:32px}
  .car .art{width:min(34vh,200px)}
  .car .txt{text-align:left;max-width:45vw}
}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:86vh;background:var(--bg);display:flex;flex-direction:column;
  padding:16px 16px calc(8px + var(--safe-b));max-width:720px;margin:0 auto}
.sheet h2{margin:0 0 8px;font-size:20px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{font-size:15px;font-weight:500;color:var(--accent);height:40px}
.sheet .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;margin:0 -16px;padding:0 16px}
.crow{display:flex;align-items:center;gap:14px;width:100%;height:56px;border-bottom:1px solid var(--line);text-align:left}
.crow .n{flex:1;font-size:17px}
.crow .c{font-size:13px;color:var(--muted)}
.crow.on .n{color:var(--accent);font-weight:500}
.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:16px 0 4px}

.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:12px 18px;font-size:15px;z-index:40;transition:.25s;max-width:calc(100vw - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.car.open ~ .toast{bottom:calc(220px + var(--safe-b))}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#161616"/>
      <g fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M12.8 15.2a8 8 0 0 0 0 9.6M27.2 15.2a8 8 0 0 1 0 9.6" stroke="#D4AE4A"/>
      <path d="M8.8 12.3a12.6 12.6 0 0 0 0 15.4M31.2 12.3a12.6 12.6 0 0 1 0 15.4" stroke="#EDEAE4"/></g>
      <circle cx="20" cy="20" r="3.7" fill="#D25B43"/></svg>
    <h1>Rádio Mundo</h1>
    <button class="country-btn" id="countryBtn"><span class="flag" id="cFlag"></span><span id="cName"></span></button>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabAll" aria-selected="true">Estações</button>
    <button role="tab" id="tabFav" aria-selected="false">Favoritas</button>
  </div>

  <div id="browse">
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar rádio ou gênero" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="qClear" aria-label="Limpar">×</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <ul class="list" id="list"></ul>
</div>

<!-- Player bar -->
<div class="bar" id="bar">
  <div class="in">
    <button class="now" id="openCar">
      <div class="thumb" id="barThumb">♪</div>
      <div class="info">
        <div class="name" id="barName">Escolha uma rádio</div>
        <div class="status" id="barStatus">Toque para ouvir</div>
      </div>
    </button>
    <button class="ctl" id="bPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="ctl main" id="bPlay" aria-label="Tocar"><svg viewBox="0 0 24 24" id="bPlayIco"></svg></button>
    <button class="ctl" id="bNext" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>

let regionNames; try { regionNames = new Intl.DisplayNames(['pt-BR'], {type:'region'}); } catch(e){}

const flag = cc => cc ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '🌍';

const GENRES = [['','Todas'],['pop','Pop'],['rock','Rock'],['news','Notícias'],['schlager','Schlager'],['80s','Anos 80'],

/* ---------- API (radio-browser.info) ---------- */
const HOSTS = ['https://de1.api.radio-browser.info','https://de2.api.radio-browser.info','https://fi1.api.radio-browser.info',
  'https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info'];
let host = store.get('host', null);
async function api(path){
  const order = host ? [host, ...HOSTS.filter(h => h !== host)] : HOSTS.slice().sort(() => Math.random() - .5);
  for (const h of order){
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
    try {
      const r = await fetch(h + path, {signal: ctrl.signal});
      clearTimeout(t);
      if (!r.ok) continue;
      const j = await r.json();
      if (host !== h){ host = h; store.set('host', h); }
      return j;
    } catch(e){ clearTimeout(t); }
  }
  throw new Error('offline');
}
const norm = s => ({
  id: s.stationuuid, name: (s.name || '').trim().replace(/\s+/g,' '), url: s.url_resolved || s.url,
  favicon: /^https:\/\//.test(s.favicon || '') ? s.favicon : '', cc: (s.countrycode || '').toUpperCase(),
  tags: (s.tags || '').split(',').map(t => t.trim()).filter(t => t && t.length < 20).slice(0, 3),
  bitrate: s.bitrate || 0, codec: (s.codec || '').toUpperCase(), clicks: s.clickcount || 0
});
// No iPhone, só HTTPS (exigência do GitHub Pages) e formatos que o Safari toca
const playable = s => s.url && /^https:\/\//i.test(s.url) && !/OGG|FLAC|UNKNOWN/.test(s.codec) && s.name;
function clean(arr){
  const seen = new Set(), out = [];
  for (const s of arr.map(norm)){
    if (!playable(s)) continue;
    const k = s.name.toLowerCase() + '|' + s.cc;
    if (seen.has(k)) continue; seen.add(k); out.push(s);
  }
  return out;
}

/* ---------- Estado ---------- */
const state = {
  tab: 'all', country: store.get('country', 'DE'), genre: '', query: '',
  stations: [], favs: store.get('favs', []), current: store.get('last', null), queue: [],
  status: 'idle', loading: false
};
let reqId = 0;

async function loadStations(){
  const my = ++reqId;
  state.loading = true; render();
  const p = new URLSearchParams({order:'clickcount', reverse:'true', hidebroken:'true', limit:'200'});
  if (state.country) p.set('countrycode', state.country);
  try {
    let data;
    if (state.query){
      const q = encodeURIComponent(state.query);
      const [a, b] = await Promise.all([
        api('/json/stations/search?' + p + '&name=' + q),
        api('/json/stations/search?' + p + '&tag=' + q).catch(() => [])
      ]);
      data = [...a, ...b].sort((x, y) => (y.clickcount || 0) - (x.clickcount || 0));
    } else {
      if (state.genre) p.set('tag', state.genre);
      data = await api('/json/stations/search?' + p);
    }
    if (my !== reqId) return;
    state.stations = clean(data).slice(0, 120);
    state.error = false;
  } catch(e){
    if (my !== reqId) return;
    state.stations = []; state.error = true;
  }
  state.loading = false; render();
}

/* ---------- Render ---------- */
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
const initials = n => esc((n.replace(/[^\p{L}\p{N} ]/gu,'').trim().split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('') || '♪').toUpperCase());
const thumb = s => s.favicon
  ? `<img src="${esc(s.favicon)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=this.dataset.i" data-i="${initials(s.name)}">`
  : initials(s.name);
const isFav = id => state.favs.some(f => f.id === id);
const metaOf = s => [state.country && state.tab === 'all' ? '' : flag(s.cc), s.tags.join(' · '), s.bitrate ? s.bitrate + ' kbps' : ''].filter(Boolean).join('  ·  ');

function render(){
  $('cFlag').textContent = flag(state.country);
  $('cName').textContent = cName(state.country);
  $('tabAll').setAttribute('aria-selected', state.tab === 'all');
  $('tabFav').setAttribute('aria-selected', state.tab === 'fav');
  $('browse').style.display = state.tab === 'all' ? '' : 'none';
  $('chips').innerHTML = GENRES.map(([t, l]) =>
    `<button class="chip" data-g="${t}" aria-pressed="${!state.query && state.genre === t}">${l}</button>`).join('');

  const list = $('list');
  const items = state.tab === 'fav' ? state.favs : state.stations;
  if (state.tab === 'all' && state.loading){ list.innerHTML = '<li class="loading"><div class="spin"></div></li>'; return renderPlayer(); }
  if (!items.length){
    list.innerHTML = state.tab === 'fav'
      ? '<li class="empty"><b>Nenhuma favorita ainda</b>Toque na estrela ao lado de uma rádio.<br>No carro, os botões de avançar e voltar trocam entre as favoritas.</li>'
      : state.error
        ? '<li class="empty"><b>Sem conexão</b>Não consegui carregar as rádios. Verifique a internet e toque em “Estações” de novo.</li>'
        : '<li class="empty"><b>Nada encontrado</b>Tente outro nome, gênero ou país.</li>';
    return renderPlayer();
  }
  const cur = state.current?.id;
  list.innerHTML = items.map((s, i) => `
    <li class="row${s.id === cur ? ' on' : ''}">
      <button class="hit" data-i="${i}">
        <div class="thumb">${thumb(s)}</div>
        <div class="info"><div class="name">${esc(s.name)}</div><div class="meta">${esc(metaOf(s))}</div></div>
      </button>
      <button class="star${isFav(s.id) ? ' fav' : ''}" data-f="${i}" aria-label="Favoritar">${STAR}</button>
    </li>`).join('');
  renderPlayer();
}

const ICO_PLAY = '<path d="M7 4.5v15l13-7.5z"/>';
const ICO_PAUSE = '<path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/>';
const ICO_LOAD = '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="36 50"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur=".9s" repeatCount="indefinite"/></circle>';

function renderPlayer(){
  const s = state.current, st = state.status;
  const ico = st === 'loading' ? ICO_LOAD : (st === 'playing' ? ICO_PAUSE : ICO_PLAY);
  $('bPlayIco').innerHTML = ico; $('cPlayIco').innerHTML = ico;
  $('bPlayIco').style.color = 'var(--bg)'; $('cPlayIco').style.color = 'var(--bg)';
  const label = {idle:'Pausado', loading:'Conectando…', playing:'Ao vivo', error:'Indisponível'}[st];
  ['bPlay','cPlay','bPrev','bNext','cPrev','cNext'].forEach(id => $(id).disabled = !s);
  if (!s){ return; }
  $('barName').textContent = s.name; $('carName').textContent = s.name;
  $('barStatus').textContent = label; $('carStatus').textContent = label;
  $('barStatus').className = $('carStatus').className = 'status' + (st === 'playing' ? ' live' : '');
  $('barThumb').innerHTML = thumb(s); $('carArt').innerHTML = thumb(s);
  $('carSub').textContent = [flag(s.cc) + ' ' + cName(s.cc), s.tags.slice(0,2).join(' · ')].filter(Boolean).join('  ·  ');
  $('carStar').classList.toggle('fav', isFav(s.id));
}

/* ---------- Player ---------- */
const audio = $('audio');
function setStatus(s){ state.status = s; renderPlayer(); syncSession(); }

function play(s, queue){
  if (!s) return;
  state.current = s;
  if (queue) state.queue = queue.slice();
  if (!state.queue.some(q => q.id === s.id)) state.queue = [s];
  store.set('last', s);
  audio.src = s.url;
  setStatus('loading');
  audio.play().catch(err => { if (err.name !== 'AbortError') fail(); });
  api('/json/url/' + s.id).catch(() => {}); // conta o clique na base pública
  setMeta(); render();
}
function toggle(){
  const s = state.current; if (!s) return;
  if (state.status === 'playing' || state.status === 'loading'){ audio.pause(); audio.removeAttribute('src'); audio.load(); setStatus('idle'); }
  else play(s, state.queue.length ? null : (isFav(s.id) ? state.favs : state.stations));
}
function step(d){
  const s = state.current; if (!s) return;
  let q = state.queue.length ? state.queue : (state.favs.length ? state.favs : state.stations);
  if (!q.length) return;
  const i = q.findIndex(x => x.id === s.id);
  play(q[(i + d + q.length) % q.length], q);
}
function fail(){
  if (!state.current) return;
  setStatus('error');
  toast('Não consegui tocar “' + state.current.name + '”. Tente a próxima.');
}
audio.addEventListener('playing', () => setStatus('playing'));
audio.addEventListener('waiting', () => { if (state.status === 'playing') setStatus('loading'); });
audio.addEventListener('error', () => { if (audio.getAttribute('src')) fail(); });
audio.addEventListener('pause', () => { if (state.status === 'playing') setStatus('idle'); });

/* Tela de bloqueio / CarPlay / volante */
function setMeta(){
  if (!('mediaSession' in navigator) || !state.current) return;
  const s = state.current;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.name,
      artist: [cName(s.cc), s.tags.slice(0,2).join(', ')].filter(Boolean).join(' · '),
      album: 'Rádio Mundo',
      artwork: s.favicon ? [{src: s.favicon, sizes: '256x256'}, {src: ICON, sizes: '180x180', type: 'image/png'}]
                         : [{src: ICON, sizes: '180x180', type: 'image/png'}]
    });
  } catch(e){}
}
function syncSession(){
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.playbackState = state.status === 'playing' ? 'playing' : (state.status === 'loading' ? 'playing' : 'paused'); } catch(e){}
}
if ('mediaSession' in navigator){
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch(e){} };
  set('play', () => { if (state.status !== 'playing') toggle(); });
  set('pause', () => { if (state.status === 'playing' || state.status === 'loading') toggle(); });
  set('stop', () => { if (state.status !== 'idle') toggle(); });
  set('nexttrack', () => step(1));
  set('previoustrack', () => step(-1));
}

/* ---------- Favoritas ---------- */
function toggleFav(s){
  const i = state.favs.findIndex(f => f.id === s.id);
  if (i >= 0){ state.favs.splice(i, 1); toast('Removida das favoritas'); }
  else { state.favs.push(s); toast('Adicionada às favoritas'); }
  store.set('favs', state.favs);
  if (state.queue === state.favs || state.tab === 'fav') state.queue = state.favs.slice();
  render();
}

/* ---------- Países (sheet) ---------- */
let countries = null;
async function openSheet(){
  $('sheet').classList.add('open'); $('cq').value = '';
  if (!countries){
    $('cList').innerHTML = '<div class="loading"><div class="spin"></div></div>';
    try {
      const data = await api('/json/countries?hidebroken=true');
      const map = {};
      data.forEach(c => { const cc = (c.iso_3166_1 || '').toUpperCase(); if (cc.length === 2) map[cc] = (map[cc] || 0) + c.stationcount; });
      countries = Object.entries(map).map(([cc, n]) => ({cc, n, name: cName(cc)})).filter(c => c.n > 0)
        .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    } catch(e){
      countries = PINNED.map(cc => ({cc, n: 0, name: cName(cc)}));
    }
  }
  renderCountries('');
}
function renderCountries(f){
  const norm = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const nf = norm(f);
  const row = c => `<button class="crow${c.cc === state.country ? ' on' : ''}" data-cc="${c.cc}"><span class="flag">${flag(c.cc)}</span><span class="n">${esc(c.name)}</span>${c.n ? `<span class="c">${c.n}</span>` : ''}</button>`;
  let html = '';
  if (!nf){
    html += '<div class="sec">Atalhos</div>' + row({cc:'', n:0, name:'Mundo todo'});
    html += PINNED.map(cc => countries.find(c => c.cc === cc) || {cc, n:0, name:cName(cc)}).map(row).join('');
    html += '<div class="sec">Todos os países</div>';
  }
  html += countries.filter(c => !nf || norm(c.name).includes(nf) || c.cc.toLowerCase() === nf).map(row).join('');
  $('cList').innerHTML = html || '<div class="empty">Nenhum país encontrado.</div>';
}
function closeSheet(){ $('sheet').classList.remove('open'); }

/* ---------- Toast ---------- */
let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- Eventos ---------- */
$('list').addEventListener('click', e => {
  const items = state.tab === 'fav' ? state.favs : state.stations;
  const f = e.target.closest('[data-f]'); if (f){ toggleFav(items[+f.dataset.f]); return; }
  const h = e.target.closest('[data-i]');
  if (h){ const s = items[+h.dataset.i]; if (state.current?.id === s.id && state.status !== 'error') toggle(); else play(s, items); }
});
$('chips').addEventListener('click', e => {
  const c = e.target.closest('[data-g]'); if (!c) return;
  state.genre = c.dataset.g; state.query = ''; $('q').value = ''; $('searchBox').classList.remove('has');
  loadStations(); window.scrollTo({top:0, behavior:'smooth'});
});
let qt;
$('q').addEventListener('input', e => {
  $('searchBox').classList.toggle('has', !!e.target.value);
  clearTimeout(qt); qt = setTimeout(() => { state.query = e.target.value.trim(); loadStations(); }, 450);
});
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('qClear').addEventListener('click', () => { $('q').value = ''; $('searchBox').classList.remove('has'); state.query = ''; loadStations(); });
$('tabAll').addEventListener('click', () => { state.tab = 'all'; if (state.error || !state.stations.length) loadStations(); else render(); });
$('tabFav').addEventListener('click', () => { state.tab = 'fav'; render(); });
$('countryBtn').addEventListener('click', openSheet);
$('sheetBg').addEventListener('click', closeSheet);
$('sheetClose').addEventListener('click', closeSheet);
$('cq').addEventListener('input', e => renderCountries(e.target.value.trim()));
$('cList').addEventListener('click', e => {
  const b = e.target.closest('[data-cc]'); if (!b) return;
  state.country = b.dataset.cc; store.set('country', state.country);
  state.tab = 'all'; closeSheet(); loadStations(); window.scrollTo({top:0});
});
$('bPlay').addEventListener('click', toggle); $('cPlay').addEventListener('click', toggle);
$('bPrev').addEventListener('click', () => step(-1)); $('cPrev').addEventListener('click', () => step(-1));
$('bNext').addEventListener('click', () => step(1)); $('cNext').addEventListener('click', () => step(1));
$('openCar').addEventListener('click', () => { if (state.current) $('car').classList.add('open'); });
$('closeCar').addEventListener('click', () => $('car').classList.remove('open'));
$('carStar').addEventListener('click', () => state.current && toggleFav(state.current));

/* ---------- Início ---------- */
if (state.current) state.queue = isFav(state.current.id) ? state.favs.slice() : [state.current];
if (state.current) setMeta();
render();
loadStations();
})();
</script>
</body>
